<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Homestay AI · Home concept</title>
<style>
:root{--bg:#f6f6f2;--ink:#151613;--muted:#696b62;--lime:#edff73;--green:#dce8cb;--blue:#c0d7f6;--pink:#f0d4e8;--yellow:#f9e787;--radius:28px}*{box-sizing:border-box}body{margin:0;background:#e5e6df;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:3px solid #526bb8;outline-offset:3px}.app{max-width:430px;margin:auto;min-height:100dvh;background:var(--bg);padding:20px 20px 120px}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:650;letter-spacing:.08em}.top button{background:transparent;min-width:44px;height:44px;letter-spacing:0}.brand{display:flex;align-items:center;gap:7px}.brand-name{border-bottom:1px dashed #9a9c93}.mark{width:22px;height:22px;background:var(--ink);color:var(--lime);border-radius:8px;display:grid;place-items:center}.intro{display:flex;align-items:center;justify-content:space-between;margin:22px 0 28px}h1{font-size:36px;font-weight:600;letter-spacing:-1.6px;line-height:1.1;margin:0 0 10px}h2{font-size:21px;letter-spacing:-.65px;font-weight:650;margin:0}h3{margin:0;font-size:16px;font-weight:600;line-height:1.35}p{margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.5}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9db96e;margin-right:6px}.avatar{width:50px;height:50px;background:var(--ink);border-radius:50%;color:var(--lime);font-size:19px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}.mini{font-size:11px;background:#e9eae3;padding:7px 10px;border-radius:50px;white-space:nowrap}.month{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:600;letter-spacing:-.5px}.round{border-radius:50%;width:44px;height:44px;background:white;display:grid;place-items:center}.round svg{width:17px;height:17px}.calendar{display:flex;gap:7px;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 0 10px;touch-action:pan-x pan-y}.calendar::-webkit-scrollbar{display:none}.day{flex:0 0 48px;min-width:48px;height:98px;border-radius:24px;background:#eaece5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;scroll-snap-align:center}.day small{font-size:10px;color:#6d7066}.day strong{font-size:18px;font-weight:600}.day i{width:4px;height:4px;background:#839867;border-radius:50%}.day.selected{flex-basis:76px;min-width:76px;background:var(--ink);color:white;border-radius:28px}.day.selected small{color:var(--lime)}.day-summary{display:block;min-width:48px;padding:4px 7px;border-radius:99px;background:var(--lime);color:var(--ink);font-size:8px;font-style:normal;font-weight:650;line-height:1;text-align:center}.agenda{background:white;border-radius:var(--radius);padding:18px;margin-top:2px}.agendahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}.agendahead span{color:var(--muted);font-size:11px}.event{display:flex;gap:12px;align-items:center;padding:12px 0}.time{font-size:11px;color:var(--muted);width:35px;flex-shrink:0}.eventbody{border-left:3px solid #b6c99c;padding-left:10px;flex:1}.eventbody strong{font-size:13px;font-weight:550;display:block}.eventbody small{font-size:11px;color:var(--muted);display:block;margin-top:3px}.section{margin-top:27px}.card{border-radius:var(--radius);padding:20px;margin-bottom:11px}.yellow{background:var(--yellow)}.pink{background:var(--pink)}.bluecard{background:var(--blue)}.cardtop{display:flex;gap:12px;align-items:flex-start}.icon{border-radius:50%;background:#171912;color:white;width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center}.icon svg{width:20px;height:20px}.card .sub{margin-top:5px;color:#54564d}.action{display:inline-flex;gap:14px;align-items:center;background:var(--ink);color:white;border-radius:99px;min-height:44px;padding:11px 17px;font-size:12px;font-weight:550;margin-top:16px}.action svg{width:15px;height:15px}.tag{display:inline-block;background:rgba(255,255,255,.56);border-radius:99px;padding:7px 11px;font-size:10px;margin-bottom:13px}.insighttext{font-size:19px;line-height:1.35;letter-spacing:-.4px;font-weight:550}.source{font-size:11px;color:#525b64;margin-top:12px;line-height:1.5}.cardbottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.footer{font-size:10px;text-align:center;color:#85887c;margin:23px 0 0;line-height:1.5}.dock{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:#141513;border-radius:44px;padding:9px 8px;display:flex;z-index:3}.tab{background:transparent;flex:1;color:#c4c5be;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;justify-content:center}.tab svg{width:20px;height:20px}.tab .navicon{width:34px;height:32px;display:grid;place-items:center;border-radius:50%}.tab.active{color:var(--lime)}.tab.active .navicon{background:var(--lime);color:#121410}dialog{border:0;border-radius:30px;padding:26px;width:calc(100% - 32px);max-width:390px;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#12151266;backdrop-filter:blur(6px)}dialog p{font-size:14px;line-height:1.6;margin:16px 0}dialog .action{width:100%;justify-content:center}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px}svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.empty{padding:0;font-size:13px;color:var(--muted);line-height:1.6}@media(min-width:500px){.app{margin:24px auto;border-radius:38px}.dock{bottom:24px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .15s}button:active{transform:scale(.97)}}
/* Soft floating navigation — homepage style exploration. */
.dock{width:calc(100% - 96px);max-width:270px;height:44px;padding:0;border-radius:22px;background:rgba(245,247,249,.58);border:0;backdrop-filter:blur(26px) saturate(115%);-webkit-backdrop-filter:blur(26px) saturate(115%);box-shadow:none}
.tab{color:#535b65;font-size:0;gap:0;min-height:44px;padding:0}
.tab svg{width:19px;height:19px;stroke-width:1.45}
.tab .navicon{width:44px;height:44px;border-radius:50%}
.tab:first-child{align-items:flex-start}
.tab:last-child{align-items:flex-end}
.tab.active{color:#303743}
.tab.active .navicon{background:#343b45;color:#fff}
</style></head><body><main class="app" id="app"></main><nav class="dock" id="dock" aria-label="Main navigation"></nav><dialog id="modal"><div class="modalhead"><h2 id="modal-title"></h2><button class="round" id="close" aria-label="Close">×</button></div><p id="modal-copy"></p><button class="action" id="modal-ok"></button></dialog>
<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',reply:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>',insight:'<path d="M4 20V4M4 20h17M7 14l5-5 4 3 5-7"/>',content:'<path d="M14 3H5v18h14V8zM14 3v6h5M8 13h8M8 17h5"/>',profile:'<circle cx="12" cy="7" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>'};const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;
let lang='en',selected=17;const tr=(en,zh)=>lang==='en'?en:zh;
function render(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.getElementById('app').innerHTML=`<header class="top"><span class="brand"><span class="mark">?</span><span class="brand-name">${tr('NAME TBD','名称待定')}</span></span><button id="language" aria-label="Switch language">${tr('中文','EN')}</button></header><div class="intro"><div><h1>${tr('Hi, Alex.','你好，Alex。')}</h1><p class="sub"><span class="dot"></span>${tr('Your little stay, beautifully managed.','用心经营，从容每一天。')}</p></div><button class="avatar" data-open="profile" aria-label="Profile">A</button></div><div class="heading"><h2 class="month">${tr('September 2026','2026 年 9 月')}</h2><span class="mini">${tr('Demo data','示例数据')}</span></div><div class="calendar" id="calendar" aria-label="Select a date"></div><div class="agenda" id="agenda"></div><section class="section"><div class="heading"><h2>${tr('A little help today','今日待处理')}</h2><span class="mini">${tr('2 tasks','2 项任务')}</span></div><article class="card yellow"><div class="cardtop"><span class="icon">${svg('reply')}</span><div><h3>${tr('A thoughtful reply, in seconds.','用贴心回复，回应客人。')}</h3><p class="sub">${tr('Room 102 · A guest asked about early check-in.','102 房 · 客人询问能否提前入住。')}</p></div></div><button class="action" data-open="reply">${tr('Draft a reply','起草回复')} ${svg('arrow')}</button></article><article class="card pink"><div class="cardtop"><span class="icon">${svg('content')}</span><div><h3>${tr('Give your weekday stay a story.','为工作日住宿写个好故事。')}</h3><p class="sub">${tr('Pick up your saved listing description.','继续编辑已保存的房源介绍。')}</p></div></div><button class="action" data-open="content">${tr('Continue draft','继续编辑')} ${svg('arrow')}</button></article></section><section class="section"><div class="heading"><h2>${tr('A fresh perspective','经营灵感')}</h2><span class="round" style="background:var(--lime);width:32px;height:32px">✳</span></div><article class="card bluecard"><span class="tag">${tr('Business insights','经营分析')}</span><p class="insighttext">${tr('A quieter week. Room for a new idea.','平日空房，也有新机会。')}</p><p class="sub" style="margin-top:10px">${tr('Your sample bookings show more weekday availability. Explore a stay-focused promotion.','示例预订记录显示工作日空房较多，可以考虑一次住宿主题推广。')}</p><p class="source">${tr('Based on sample booking records · Not a market forecast','依据：示例预订记录 · 不代表市场预测')}</p><button class="action" data-open="insight">${tr('Explore the insight','查看分析建议')} ${svg('arrow')}</button></article></section><p class="footer">${tr('HOME CONCEPT · BRAND, PROPERTY & DATA ARE PLACEHOLDERS','首页概念样稿 · 品牌、民宿与数据均为占位内容')}</p>`;
document.getElementById('dock').innerHTML=['home','reply','insight','content','profile'].map((k,i)=>`<button class="tab ${i===0?'active':''}" aria-label="${tr(['Home','Replies','Insights','Content','Profile'][i],['首页','回复','分析','推广','我的'][i])}" ${i===0?'aria-current="page"':''} data-open="${k}"><span class="navicon">${svg(k)}</span></button>`).join('');
let cal=document.getElementById('calendar');cal.innerHTML=Array.from({length:21},(_,i)=>{let d=i+14,w=new Date(2026,8,d).getDay(),date=new Date(2026,8,d),hasEvent=[16,17,18,21].includes(d);return `<button class="day ${selected===d?'selected':''}" data-date="${d}" aria-pressed="${selected===d}" aria-label="${date.toLocaleDateString(lang==='en'?'en-US':'zh-CN')}"><small>${tr(['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][w],['日','一','二','三','四','五','六'][w])}</small><strong>${date.getDate()}</strong>${hasEvent?(selected===d?`<span class="day-summary">${tr('1 event','1 项日程')}</span>`:'<i></i>'):''}</button>`}).join('');
document.getElementById('language').onclick=()=>{let pos=cal.scrollLeft;lang=lang==='en'?'zh':'en';render();document.getElementById('calendar').scrollLeft=pos};cal.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.date);cal.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});agenda()});bind();agenda()}
function agenda(){let date=new Date(2026,8,selected),busy=[16,17,18,21].includes(selected);document.getElementById('agenda').innerHTML=`<div class="agendahead"><strong>${date.toLocaleDateString(lang==='en'?'en-US':'zh-CN',{weekday:'short',month:'short',day:'numeric'})}</strong><span>${busy?tr('1 event','1 项日程'):''}</span></div>${busy?`<div class="event"><span class="time">14:00</span><div class="eventbody"><strong>${tr('Guest check-in','客人入住')}</strong><small>${tr('Room 102 · Garden room','102 房 · 花园房')}</small></div></div>`:`<p class="empty">${tr('No events','无日程')}</p>`}`;}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let k=b.dataset.open;if(k==='home'){window.scrollTo({top:0,behavior:'smooth'});return}let names={reply:tr('Inquiries & Reviews','咨询与评价'),insight:tr('Business Insights','经营分析'),content:tr('Promotional Content','内容推广'),profile:tr('Your property','我的民宿')};let copy={reply:tr('Draft guest replies using your property’s policies. This destination is a preview placeholder; AI generation is not connected yet.','根据民宿规则起草咨询与评价回复。此处为页面入口预览，尚未接入 AI。'),insight:tr('Understand booking changes, review the evidence, and choose your next action. Detailed analysis will be designed next.','理解经营变化，查看依据并选择下一步行动。详细分析页面待设计。'),content:tr('Create and edit listing descriptions and promotional copy. Your content workspace will be designed next.','创建并编辑房源介绍与推广文案。内容工作区待设计。'),profile:tr('Garden House · Sample property. Property details and account settings will live here. Use 中文 at the top of Home to change language.','花园民宿 · 示例资料。这里将管理民宿信息与账号设置。主页顶部可切换语言。')};document.getElementById('modal-title').textContent=names[k];document.getElementById('modal-copy').textContent=copy[k];document.getElementById('modal-ok').textContent=tr('Back to home','返回首页');document.getElementById('modal').showModal()})}
document.getElementById('close').onclick=document.getElementById('modal-ok').onclick=()=>document.getElementById('modal').close();
</script><link rel="stylesheet" href="home.css"><script src="home.js"></script><link rel="stylesheet" href="workspace.css"><script src="workspace.js"></script><link rel="stylesheet" href="analysis.css"><script src="analysis.js"></script><link rel="stylesheet" href="explore.css"><script src="explore.js"></script><link rel="stylesheet" href="assistant.css"><script src="assistant.js"></script><link rel="stylesheet" href="property.css"><script src="property.js"></script></body></html>
